services:
  # Consolidated Monolithic Server (Backend API + Static Web Frontend)
  - type: web
    name: sanskar-production
    env: node
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Provide in Render dashboard
      - key: JWT_SECRET
        sync: false # Provide in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EXPO_PUBLIC_API_URL
        value: / # Self-referencing relative path for frontend API calls
